olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen38llama: 1

metadata:
  name: aimqwen38llama
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen38llama/main/icon.png
  description: Qwen3.8-27B Vision via buun-llama
  appid: aimqwen38llama
  title: AIM Qwen3.8 27B
  version: '26.9.13'
  categories:
    - AI
    - Vision

entrances:
  - name: aimqwen38llama
    port: 8000
    host: aimqwen38llama
    title: AIM Qwen3.8 27B
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen38llama/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.9.13'
  upgradeDescription: |
    v26.9.13: --resume-no-host-cache aktiviert - der Resume-Store haelt nur noch den Slot-Zustand (keine Host-Prompt-Cache-Kopien): Startup-Install 0,96s statt 3,9-10,4s, deutlich weniger JuiceFS-I/O (Store waechst nur noch langsam). Warm-Restart unveraendert (48k nach Neustart 0,2s). VBR (neu getestet, entry f16/floor t2/4G): Perf & Recall paritaetisch, aber Peak 23.252 MiB / 733 MiB frei gegenueber 22.788 / 1.197 statisch -> statisch K=q8_0/V=turbo4 bleibt. Built for Olares 1.12.6.
  fullDescription: |
    AImighty flagship stack for Qwen3.8-27B, the latest dense hybrid-attention VL model, optimized for coding, vision and long-horizon agentic workflows on Olares One.

    Model:
    - 0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored (RVN: ARA + Heretic-Abliteration, Q4_K_M, native MTP head)
    - Vision: mmproj-Q8_0.gguf on GPU
    - 150K token context (K q8_0, V turbo4 - 4-bit Walsh-Hadamard rotated)

    Inference Engine:
    - buun-llama-cpp (spiritbuun master 03e5ad6c, CUDA 13.1 sm_120 custom build)
    - DFlash2 speculative decoding (draft-dflash, Q4_K_M draft, --spec-draft-n-max 7)
    - Warm-restart resume: conversation KV is saved at shutdown and restored at startup (--resume)
    - Parallel slots: 1, Batch: 2048/512, Reasoning: on (medium), KV-cache reuse

    Performance:
    Space Invaders HTML: 127 t/s
    Creative Writing: 82 t/s
    OpenAI-compatible: /v1/chat/completions, /v1/models, /health
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen38llama
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen38llama
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: 24Gi
  limitedMemory: 40Gi
  requiredDisk: 25Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
