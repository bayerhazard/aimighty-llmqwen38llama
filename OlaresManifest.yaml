olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen38llama: 1

metadata:
  name: aimqwen38llama
  icon: https://app.cdn.olares.com/appstore/llamacpp/icon2.png
  description: Qwen3.8-27B Vision via buun-llama
  appid: aimqwen38llama
  title: AIM Qwen3.8 27B
  version: '26.08.3'
  categories:
    - AI
    - Vision

entrances:
  - name: aimqwen38llama
    port: 8000
    host: aimqwen38llama
    title: AIM Qwen3.8 27B
    icon: https://app.cdn.olares.com/appstore/llamacpp/icon2.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.08.3'
  fullDescription: |
    AImighty flagship stack for Qwen3.8-27B, the latest dense hybrid-attention VL model, optimized for coding, vision and long-horizon agentic workflows on Olares One.

    Model:
    - unsloth/Qwen3.8-27B-GGUF (UD-Q4_K_XL, native Gated DeltaNet + Gated Attention, MTP)
    - Vision: mmproj-F16.gguf on GPU
    - 200K token context Turbo4 (4-bit Walsh-Hadamard rotated)

    Inference Engine:
    - buun-llama-cpp (spiritbuun master HEAD, CUDA 13.1 sm_120 custom build)
    - MTP (draft-mtp, --spec-draft-n-max 3)
    - Parallel slots: 1, Batch: 2048/512, Reasoning: on with reasoning-preserve

    Performance:
    Space Invaders HTML: 100 t/s
    Creative Writing: 65 t/s
    OpenAI-compatible: /v1/chat/completions, /v1/models, /health
  upgradeDescription: |
    26.08.3 Initial Release for Olares One
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen38llama
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen38llama
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: 24Gi
  limitedMemory: 40Gi
  requiredDisk: 25Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
