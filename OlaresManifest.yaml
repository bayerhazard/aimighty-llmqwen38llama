olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen38llama: 1

metadata:
  name: aimqwen38llama
  icon: https://app.cdn.olares.com/appstore/llamacpp/icon2.png
  description: Qwen3.8-27B Vision via buun-llama
  appid: aimqwen38llama
  title: AIM Qwen3.8 27B
  version: '26.08.13'
  categories:
    - AI
    - Vision

entrances:
  - name: aimqwen38llama
    port: 8000
    host: aimqwen38llama
    title: AIM Qwen3.8 27B
    icon: https://app.cdn.olares.com/appstore/llamacpp/icon2.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.08.13'
  fullDescription: |
    AImighty flagship stack for Qwen3.8-27B, the latest dense hybrid-attention VL model, optimized for coding, vision and long-horizon agentic workflows on Olares One.

    Model:
    - unsloth/Qwen3.8-27B-GGUF (UD-Q4_K_XL, native Gated DeltaNet + Gated Attention, MTP)
    - Vision: mmproj-F16.gguf on GPU
    - 200K token context Turbo4 (4-bit Walsh-Hadamard rotated)

    Inference Engine:
    - buun-llama-cpp (spiritbuun master HEAD, CUDA 13.1 sm_120 custom build)
    - MTP (draft-mtp, --spec-draft-n-max 3)
    - Parallel slots: 1, Batch: 2048/512, Reasoning: on, KV-cache reuse

    Performance:
    Space Invaders HTML: 100 t/s
    Creative Writing: 65 t/s
    OpenAI-compatible: /v1/chat/completions, /v1/models, /health
  upgradeDescription: |
    26.08.13: --reasoning-budget 8192 (hartes Thinking-Cap, kein Ausufern) + budget-message; Antworten entkoppelt von max_tokens; Built for Olares 1.12.6.
    26.08.12: --reasoning-preserve (Reasoning bleibt im Multi-Turn-Verlauf erhalten) + GGUF Dynamic V3.0 (Unsloth Aug-19-Update, ~10% mehr Genauigkeit); Built for Olares 1.12.6.
    26.08.11: Engine buun-llama-cpp 39d97a8 (MTP+mmproj swap-fit accounting — spart VRAM auf hybriden Qwen-Modellen) via shared build-output; benchmarks ≥ baseline, keine Regression; Built for Olares 1.12.6.
    26.08.10: Fixed --chat-template-kwargs to valid JSON object ('{"reasoning_effort":"medium"}') — flat key=value crashed llama-server (json.parse_error); Built for Olares 1.12.6.
    26.08.5: Reasoning effort medium (--chat-template-kwargs reasoning_effort=medium) for complete, faster answers; Built for Olares 1.12.6.
    26.08.4: KV-cache reuse (--cache-reuse 256) for long-context divergence; Built for Olares 1.12.6.
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen38llama
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen38llama
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: 24Gi
  limitedMemory: 40Gi
  requiredDisk: 25Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
