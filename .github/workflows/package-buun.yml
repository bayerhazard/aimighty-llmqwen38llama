name: Package buun build-output to ghcr

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the build-output artifact run (bayerhazard/aimighty-llmqwen3635ba3b)'
        required: true
      artifact_name:
        description: 'Name of the build-output artifact (buun-llama-server-<pin>)'
        required: true
      image_tag:
        description: 'Target ghcr image tag'
        required: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download build-output artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: bayerhazard/aimighty-llmqwen3635ba3b
          path: ./buun-files

      - name: Inspect build-output
        run: |
          ls -la ./buun-files/

      - name: Create Dockerfile
        run: |
          cat > Dockerfile.pkg << 'EOF'
          FROM docker.io/aamsellem/buun-llama-cpp:87c351d2
          COPY buun-files/ /app-new/
          RUN mkdir -p /app && \
              cp /app-new/libggml-base.so.0.22.0 /app/ && \
              cp /app-new/libggml-cpu.so.0.22.0 /app/ && \
              cp /app-new/libggml-cuda.so.0.22.0 /app/ && \
              cp /app-new/libggml.so.0.22.0 /app/ && \
              cp /app-new/libllama-common.so.0.3.0 /app/ && \
              cp /app-new/libllama-server-impl.so /app/ && \
              cp /app-new/libllama.so.0.3.0 /app/ && \
              cp /app-new/libmtmd.so.0.3.0 /app/ && \
              cp /app-new/llama-server-new /app/llama-server && \
              chmod +x /app/llama-server && \
              ln -sf libggml-base.so.0.22.0 /app/libggml-base.so.0 && \
              ln -sf libggml-base.so.0.22.0 /app/libggml-base.so && \
              ln -sf libggml-cpu.so.0.22.0 /app/libggml-cpu.so.0 && \
              ln -sf libggml-cpu.so.0.22.0 /app/libggml-cpu.so && \
              ln -sf libggml-cuda.so.0.22.0 /app/libggml-cuda.so.0 && \
              ln -sf libggml-cuda.so.0.22.0 /app/libggml-cuda.so && \
              ln -sf libggml.so.0.22.0 /app/libggml.so.0 && \
              ln -sf libggml.so.0.22.0 /app/libggml.so && \
              ln -sf libllama-common.so.0.3.0 /app/libllama-common.so.0 && \
              ln -sf libllama-common.so.0.3.0 /app/libllama-common.so && \
              ln -sf libllama.so.0.3.0 /app/libllama.so.0 && \
              ln -sf libllama.so.0.3.0 /app/libllama.so && \
              ln -sf libmtmd.so.0.3.0 /app/libmtmd.so.0 && \
              ln -sf libmtmd.so.0.3.0 /app/libmtmd.so && \
              rm -rf /app-new && \
              echo "done"
          ENV LD_LIBRARY_PATH=/app
          ENTRYPOINT ["/app/llama-server"]
          EOF
          echo "Dockerfile.pkg created"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pkg
          push: true
          tags: ghcr.io/bayerhazard/buun-llama-cpp:${{ inputs.image_tag }}

      - name: Summary
        run: |
          echo "## Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "**ghcr.io/bayerhazard/buun-llama-cpp:${{ inputs.image_tag }}**" >> "$GITHUB_STEP_SUMMARY"
