name: Fetch buun artifact to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the source artifact run'
        required: true
      release_tag:
        description: 'Release tag to attach artifact to'
        required: true
      artifact_name:
        description: 'Artifact name to download'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./artifact

      - name: Create release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh --repo bayerhazard/aimighty-llmqwen3635ba3b release view "${{ inputs.release_tag }}" >/dev/null 2>&1 \
            || gh --repo bayerhazard/aimighty-llmqwen3635ba3b release create "${{ inputs.release_tag }}" \
                 --title "buun-llama-cpp ${{ inputs.release_tag }}" \
                 --notes "Build artifact for buun-llama-cpp commit"

      - name: Package and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifact
          tar -czf /tmp/buun-build-output.tar.gz .
          ls -la /tmp/buun-build-output.tar.gz
          gh --repo bayerhazard/aimighty-llmqwen3635ba3b release upload "${{ inputs.release_tag }}" /tmp/buun-build-output.tar.gz --clobber
          gh --repo bayerhazard/aimighty-llmqwen3635ba3b release view "${{ inputs.release_tag }}" --json assets -q '.assets[].name'
