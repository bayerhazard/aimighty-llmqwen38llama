{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $engineArgs := $oe.ENGINE_ARGS | default "" -}}
{{- /* MODEL_MODE=embedding -> auto-add llama.cpp's --embedding so it works out
       of the box; skipped if the user already passed it in ENGINE_ARGS. */ -}}
{{- $modelMode := $oe.MODEL_MODE | default "" -}}
{{- if and (eq $modelMode "embedding") (not (contains "--embedding" $engineArgs)) -}}
{{- $engineArgs = trim (printf "%s --embedding" $engineArgs) -}}
{{- end -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
{{- $cpuRequest := trim ($oe.LLAMACPP_CPU_REQUEST | default "200m") -}}
{{- $memRequest := trim ($oe.LLAMACPP_MEMORY_REQUEST | default "21Gi") -}}
{{- $cpuLimit := trim ($oe.LLAMACPP_CPU_LIMIT | default "6") -}}
{{- $memLimit := trim ($oe.LLAMACPP_MEMORY_LIMIT | default "30Gi") -}}
{{- $gpuType := .Values.gpu | default "" -}}
{{- if not $gpuType -}}
{{- $gpuType = .Values.GPU.Type | default "nvidia" -}}
{{- end -}}
{{- $unifiedMem := eq $gpuType "nvidia-gb10" -}}
{{- $engineArgs = include "aimqwen38llama.engineArgs" (dict "Args" $engineArgs) -}}
{{- /* Exclusive-GPU path (like AIM Qwen3.8 35B): requiredGpu -> nvidia.com/gpu:1.
       HAMi gpumem slices proved unstable across Olares 1.12.7 suspend/resume
       (the stop path patches nvidia.com/gpumem limit to 0 while the request
       stays set -> "must be equal to nvidia.com/gpumem limit of 0"). Using the
       exclusive nvidia.com/gpu resource keeps stop/resume/upgrade symmetric. */ -}}
{{- $gpuResource := "nvidia.com/gpu" -}}
{{- $gpuCount := 1 -}}
{{- $runStateHostPath := printf "%s/huggingface/llm-init-run/%s" .Values.userspace.appCommon .Release.Name -}}
---
# llama.cpp engine Deployment. wrappers/llamacpp.sh blocks on the sentinel
# (download ready), then execs llama-server -hf "$MODEL_NAME".
# llm-init reverse-proxies at http://llamacpp:8081 — Service name MUST be
# "llamacpp". GPU base: CUDA server build + gpu-inject; put `-ngl all` in
# ENGINE_ARGS to offload all layers to the GPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Primary workload: named after the release (== appid aimqwen38llama) for v3
  # allowMultipleInstall. Label/selector stays io.kompose.service: llamacpp.
  name: aimqwen38llama
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: aimqwen38llama
  annotations:
    applications.app.bytetrade.io/gpu-inject: "llamacpp"
spec:
  replicas: {{ .Values.workloads.aimqwen38llama.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: aimqwen38llama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: aimqwen38llama
    spec:
      restartPolicy: Always
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ $runStateHostPath }}"
            type: DirectoryOrCreate
        - name: wrappers
          configMap:
            name: llm-init-wrappers
            defaultMode: 0555
      containers:
        - name: llamacpp
          image: ghcr.io/bayerhazard/buun-llama-cpp:ab22bc53
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/llm-init/wrappers/llamacpp.sh"]
          env:
            - name: ENGINE_KIND
              value: llamacpp
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: MODEL_MODE
              value: "{{ $modelMode }}"
            - name: LLAMACPP_PORT
              value: "8081"
            - name: WAIT_TIMEOUT
              value: "3600"
            - name: ENGINE_ARGS
              value: "{{ $engineArgs }}"
            - name: HF_HUB_CACHE
              value: /cache/hf/hub
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HF_TOKEN
{{- end }}
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
          ports:
            - name: llamacpp
              containerPort: 8081
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
              readOnly: true
            - name: run-state
              mountPath: /run/llm-init
            - name: wrappers
              mountPath: /llm-init/wrappers
              readOnly: true
          resources:
            # Exclusive GPU (nvidia.com/gpu) — same model as AIM Qwen3.8 35B.
            # No nvidia.com/gpumem: the Olares stop path would set its limit to
            # 0 and reject unequal requests/limits on suspend.
            requests:
              cpu: "{{ $cpuRequest }}"
              memory: "{{ $memRequest }}"
{{- if not $unifiedMem }}
              {{ $gpuResource }}: {{ $gpuCount }}
{{- end }}
            limits:
              cpu: "{{ $cpuLimit }}"
              memory: "{{ $memLimit }}"
{{- if not $unifiedMem }}
              {{ $gpuResource }}: {{ $gpuCount }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: aimqwen38llama
spec:
  selector:
    io.kompose.service: aimqwen38llama
  ports:
    - name: llamacpp
      port: 8081
      targetPort: 8081
  type: ClusterIP
