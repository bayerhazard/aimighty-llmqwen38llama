olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen38llama: 1

metadata:
  name: aimqwen38llama
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen38llama/main/icon.png
  description: Qwen3.8-27B chat via buun-llama-cpp (llama.cpp) — 200K context, vision, MTP speculation, turbo4 KV
  appid: aimqwen38llama
  title: AIM Qwen3.8 27B
  version: '26.08.6'
  categories:
    - AI
    - Vision

entrances:
  - name: aimqwen38llama
    port: 8000
    host: aimqwen38llama
