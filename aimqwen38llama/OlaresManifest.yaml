olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen38llama: 1

metadata:
  name: aimqwen38llama
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen38llama/main/icon.png
  description: Qwen3.8-27B Vision via buun-llama
  appid: aimqwen38llama
  title: AIM Qwen3.8 27B
  version: '26.9.9'
  categories:
    - AI
    - Vision

entrances:
  - name: aimqwen38llama
    port: 8000
    host: aimqwen38llama
    title: AIM Qwen3.8 27B
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen38llama/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.9.9'
  upgradeDescription: |
    v26.9.9: Uncensored-Modell (0bserverx RVN Heretic-Abliterated Qwen3.8-27B, Q4_K_M, KL~0.0085) ersetzt das Basismodell - 0/48 Refusals im AImighty-Test, +5% Decode (127/82 t/s), Needle 25/25, Tool 9/9, Recall@110k 4/4; Kontext auf 125K gesenkt (VRAM-Sicherheit). Modell-Pfade, Engine und Drafter im Chart fixiert. Built for Olares 1.12.6.
  fullDescription: |
    AImighty flagship stack for Qwen3.8-27B, the latest dense hybrid-attention VL model, optimized for coding, vision and long-horizon agentic workflows on Olares One.

    Model:
    - 0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored (RVN: ARA + Heretic-Abliteration, Q4_K_M, native MTP head)
    - Vision: mmproj-Q8_0.gguf on GPU
    - 125K token context Turbo4 (4-bit Walsh-Hadamard rotated)

    Inference Engine:
    - buun-llama-cpp (spiritbuun master 1d0f493c, CUDA 13.1 sm_120 custom build)
    - DFlash2 speculative decoding (draft-dflash, Q4_K_M draft, --spec-draft-n-max 7)
    - Parallel slots: 1, Batch: 2048/512, Reasoning: on (medium), KV-cache reuse

    Performance:
    Space Invaders HTML: 127 t/s
    Creative Writing: 82 t/s
    OpenAI-compatible: /v1/chat/completions, /v1/models, /health
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen38llama
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen38llama
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: 24Gi
  limitedMemory: 40Gi
  requiredDisk: 25Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
