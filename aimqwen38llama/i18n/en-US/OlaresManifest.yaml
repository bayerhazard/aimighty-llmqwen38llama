metadata:
  description: "AIM Qwen3.8 27B - RVN (uncensored) via buun-llama-cpp + Olares Model Console (llm-init)"
  title: AIM Qwen3.8 27B

spec:
  fullDescription: |
    AImighty flagship stack for Qwen3.8-27B, the dense hybrid-attention VL model, optimized for coding, vision and long-horizon agentic workflows on Olares One - now served through the Olares Model Console.

    **Model**
    - 0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored (RVN: ARA + Heretic abliteration, Q4_K_M, native MTP head)
    - Vision projector (mmproj Q8_0) and DFlash2 draft, fetched into the shared HF cache
    - 150K token context (K q8_0, V turbo4 - 4-bit Walsh-Hadamard rotated)

    **Model Console**
    - beclab/llm-init v1.3.5 downloads the weights into the shared appCommon HF cache, publishes the model card on /api/model-spec, serves the console UI and the OpenAI-compatible API on port 8090, and reverse-proxies the engine on llamacpp:8081.

    **Inference Engine**
    - buun-llama-cpp (spiritbuun master ab22bc53, CUDA 13.1 sm_120 custom build)
    - DFlash2 speculative decoding (draft-dflash, Q4_K_M draft, --spec-draft-n-max 7)
    - Warm-restart resume: conversation KV is saved at shutdown and restored at startup (--resume)
    - Parallel slots: 1, Batch: 1024/256, Reasoning: medium (8192 budget), cache-reuse 256

    **API**
    OpenAI-compatible: /v1/chat/completions, /v1/models, /health (port 8090).

    **Resource Usage**
    ~22 GiB VRAM (23Gi memory slice), 24-40 GiB RAM, ~19 GB model cache in the shared appCommon HF cache.
